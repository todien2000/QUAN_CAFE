<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Quán</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; background: #f9f9f9; }
        .item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .send-btn { width: 100%; background: #2ed573; padding: 12px; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>MENU QUÁN</h2>
    <input type="text" id="soBan" placeholder="Nhập số bàn của bạn (Ví dụ: Bàn 1)">

    <div class="item">
        <span>Cà phê sữa đá - 20k</span>
        <button onclick="chonMon('Cà phê sữa đá')">Chọn</button>
    </div>
    <div class="item">
        <span>Bánh mì ốp la - 25k</span>
        <button onclick="chonMon('Bánh mì ốp la')">Chọn</button>
    </div>

    <h3>Món đã chọn:</h3>
    <ul id="danhSachChon"></ul>

    <button class="send-btn" onclick="guiOrder()">GỬI ORDER NGAY</button>

    <script>
        let dsMon = [];
        function chonMon(tenMon) {
            dsMon.push(tenMon);
            let ul = document.getElementById('danhSachChon');
            ul.innerHTML += `<li>${tenMon}</li>`;
            alert(`Đã thêm: ${tenMon}`);
        }

        async function guiOrder() {
            let soBan = document.getElementById('soBan').value;
            if(!soBan) { alert('Vui lòng nhập số bàn!'); return; }
            if(dsMon.length === 0) { alert('Chưa chọn món nào!'); return; }

            let orderData = {
                ban: soBan,
                mon: dsMon,
                thoiGian: new Date().toLocaleTimeString()
            };

            // Gửi trực tiếp lên Firebase Realtime Database miễn phí của bạn
            let url = "https://chualanh-f51a9-default-rtdb.firebaseio.com/orders.json"; //
            
            let res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if(res.ok) {
                alert('Gửi order thành công! Chủ quán đã nhận được yêu cầu.');
                location.reload();
            } else {
                alert('Lỗi gửi order!');
            }
        }
    </script>
</body>
</html>
